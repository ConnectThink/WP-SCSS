name: Deploy to WordPress.org

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run as dry-run (no changes will be pushed)'
        required: false
        type: boolean
        default: true

jobs:
  deploy:
    name: WordPress Plugin Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run == true }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: wp-scss
          VERSION: ${{ steps.version.outputs.version }}

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; leaving it alone."
            exit 0
          fi
          # The notes are this version's section of the readme.txt changelog ("= X.Y.Z =" up to the next "= ... =")
          awk -v v="$VERSION" '$0 == "= " v " =" {found=1; next} found && /^= .* =$/ {exit} found' readme.txt \
            | sed 's/^  //' | sed '/^[[:space:]]*$/d' > changelog.md
          if [ ! -s changelog.md ]; then
            echo "::error::No '= $VERSION =' section in the readme.txt changelog"
            exit 1
          fi
          { echo "Published on wordpress.org: https://wordpress.org/plugins/wp-scss/"; echo; cat changelog.md; } > notes.md
          gh release create "$VERSION" --title "$VERSION" --verify-tag --notes-file notes.md
